[project]
name = "dashboard-template"
version = "0.1.0"
description = "본부 대시보드 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[tool.uv]
# 애플리케이션이라 패키지로 빌드하지 않고 의존성만 .venv 에 설치한다.
# 실행은 레포 맨 위에서 `uvicorn src.backend.main:app`.
package = false

# 사내 매니저 SDK(llm-manager 등)를 쓰면 여기에 ref 없이 적는다. 형식은 Kiwoom-RM 의
# pyproject.toml 을 따른다. ref 를 박으면 매니저끼리의 URL 이 달라져 리졸버가 충돌한다.
# [tool.uv.sources]

[tool.pytest.ini_options]
testpaths = ["src/backend/tests"]
