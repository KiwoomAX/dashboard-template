<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 탭 아이콘은 모든 대시보드가 같은 K 심볼을 쓴다(셸이 정한다) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>대시보드</title>
    <script>
      /* 셸이 쓰는 스크립트다. 고치지 않는다.
         첫 페인트 전에 낮/밤과 사이드바 접힘을 <html> 속성으로 건다. 앱이 뜬 뒤에 걸면
         밝은 화면이 한 번 그려졌다 어두워진다. 키 이름은 src/shell/prefs.ts 와 같다. */
      (function () {
        var root = document.documentElement;
        var theme = null;
        var rail = null;
        try {
          theme = localStorage.getItem('kw-division-dashboard-theme');
          rail = localStorage.getItem('kw-division-dashboard-rail');
        } catch (e) {}
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.setAttribute('data-theme', theme === 'light' || theme === 'dark' ? theme : sysDark ? 'dark' : 'light');
        if (rail === 'collapsed') root.setAttribute('data-rail', 'collapsed');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
